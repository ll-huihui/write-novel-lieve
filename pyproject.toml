[project]
name = "write-novel-live"
version = "0.1.0"
description = "AI 写小说直播工具：稿纸式逐字写作展示 + 弹幕互动 + 语音"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "gradio-client>=2.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "websockets>=17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
